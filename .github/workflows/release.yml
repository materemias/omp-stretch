name: Release

# Pushing a `vX.Y.Z` tag publishes a GitHub release whose notes are the `## X.Y.Z (date)`
# section of CHANGELOG.md. A missing or empty section fails the run instead of publishing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Publish only a tag whose tests pass and whose version matches the tag. The tests keep
      # package.json, the marketplace catalog and the Tern plugin on one version.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun test
      - name: Version matches the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$(jq -r .version package.json)" = "$v" ] || { echo "package.json version is not $v"; exit 1; }
      - name: Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no notes under '## $v'"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "omp-stretch $v" --notes-file notes.md --verify-tag
